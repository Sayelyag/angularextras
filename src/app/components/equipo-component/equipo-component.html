<!-- Contenedor principal de Bootstrap -->
<div class="container mt-4 py-4">

    <!-- Título de la página -->
    <h2
        class="mb-4 fw-bold text-center"
        style="color: #005187; font-size: 2.2rem;"
    >
        Equipos de fútbol
    </h2>

    <!-- Fila de Bootstrap -->
    <div class="row g-4 justify-content-center">

        <!-- Recorremos el array de equipos -->
        @for (equipo of equipos; track equipo) {

            <!-- Creamos una tarjeta por cada equipo -->
            <div class="col-12 col-sm-6 col-lg-4 col-xl-3">

                <div
                    class="card h-100 border-0 rounded-4 text-center"
                    style="
                        background-color: #feffff;
                        border: 1px solid #c4dafa !important;
                        box-shadow: 0 6px 20px rgba(0, 81, 135, 0.12);
                        overflow: hidden;
                        transition: transform 0.2s ease, box-shadow 0.2s ease;
                    "
                    onmouseover="this.style.transform='translateY(-6px)'; this.style.boxShadow='0 12px 28px rgba(0, 81, 135, 0.2)'"
                    onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 6px 20px rgba(0, 81, 135, 0.12)'"
                >

                    <!-- Imagen del equipo -->
                    <!-- [src] enlaza la imagen con la propiedad del objeto -->
                    <div
                        class="d-flex justify-content-center align-items-center p-4"
                        style="
                            background-color: #c4dafa;
                            min-height: 170px;
                        "
                    >
                        <img
                            [src]="equipo.imagen"
                            class="card-img-top"
                            [alt]="equipo.nombre"
                            style="
                                height: 120px;
                                max-width: 100%;
                                object-fit: contain;
                            "
                        >
                    </div>

                    <!-- Contenido de la tarjeta -->
                    <div class="card-body d-flex flex-column p-4">

                        <!-- Nombre del equipo -->
                        <h5
                            class="card-title fw-bold mb-3"
                            style="color: #005187; font-size: 1.25rem;"
                        >
                            {{ equipo.nombre }}
                        </h5>

                        <!-- Número de Champions -->
                        <p class="mb-2" style="color: #4d82be;">
                            <strong style="color: #005187;">Champions:</strong>
                            {{ equipo.champions }}
                        </p>

                        <!-- Número de finales -->
                        <p class="mb-4" style="color: #4d82be;">
                            <strong style="color: #005187;">Finales:</strong>
                            {{ equipo.finalista }}
                        </p>

                        <!-- Enlace a la página web -->
                        <a
                            [href]="equipo.web"
                            target="_blank"
                            class="btn mt-auto fw-semibold"
                            style="
                                background-color: #005187;
                                color: #feffff;
                                border: none;
                                border-radius: 50px;
                                padding: 10px 20px;
                                transition: background-color 0.2s ease;
                            "
                            onmouseover="this.style.backgroundColor='#4d82be'"
                            onmouseout="this.style.backgroundColor='#005187'"
                        >
                            Página web
                        </a>

                    </div>
                </div>

            </div>
        }
    </div>
</div>
